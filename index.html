<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Arena</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #FAF9F6; --surface: #FFFFFF; --surface-2: #F1EFE8;
    --border: rgba(0,0,0,0.1); --border-md: rgba(0,0,0,0.18);
    --text: #1A1A18; --muted: #6B6A65; --hint: #A09F9A; --accent: #1A1A18;
    --r-md: 8px; --r-lg: 14px;
    --font-body: 'DM Sans', sans-serif;
    --font-display: 'EB Garamond', Georgia, serif;
    --nav-h: 60px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); min-height: 100vh; font-family: var(--font-body); color: var(--text); line-height: 1.6; }

  /* ── Layout ── */
  .wrap {
    max-width: 680px; margin: 0 auto;
    padding: 1.5rem 1.25rem calc(var(--nav-h) + 1.5rem + env(safe-area-inset-bottom));
  }

  /* ── Auth ── */
  .auth-wrap { max-width: 380px; margin: 0 auto; padding: 3rem 1.25rem 2rem; }
  .auth-wordmark { font-family: var(--font-display); font-size: 28px; font-weight: 400; text-align: center; margin-bottom: 6px; }
  .auth-sub { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 2rem; }
  .auth-tabs { display: flex; border-bottom: 0.5px solid var(--border); margin-bottom: 1.5rem; }
  .auth-tab { flex: 1; background: none; border: none; border-bottom: 2px solid transparent; padding: 12px; cursor: pointer; font-size: 14px; font-family: var(--font-body); color: var(--muted); transition: all 0.15s; min-height: 44px; }
  .auth-tab.on { color: var(--text); border-bottom-color: var(--text); font-weight: 500; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.08em; }
  /* 16px previene lo zoom automatico su iOS */
  .field input { width: 100%; padding: 12px; border: 0.5px solid var(--border-md); border-radius: var(--r-md); font-family: var(--font-body); font-size: 16px; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.15s; min-height: 44px; }
  .field input:focus { border-color: var(--accent); }
  .auth-error { background: #FCEBEB; color: #791F1F; border-radius: var(--r-md); padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
  .auth-success { background: #EAF3DE; color: #27500A; border-radius: var(--r-md); padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }

  /* ── Wordmark ── */
  .wordmark { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: center; }
  .logout-btn { background: none; border: none; cursor: pointer; font-size: 12px; color: var(--hint); text-decoration: underline; font-family: var(--font-body); padding: 4px 0; min-height: 44px; display: flex; align-items: center; }

  /* ── Header XP/Streak ── */
  .header { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 1.25rem; border-bottom: 0.5px solid var(--border); margin-bottom: 1.25rem; }
  .level-name { font-family: var(--font-display); font-size: 22px; font-weight: 400; line-height: 1.2; margin-bottom: 3px; }
  .xp-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .progress-bar { width: 140px; height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 3px; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }
  .progress-hint { font-size: 11px; color: var(--hint); margin-top: 5px; }
  .streak-block { text-align: right; }
  .streak-num { font-family: var(--font-display); font-size: 28px; font-weight: 400; line-height: 1; }
  .streak-label { font-size: 11px; color: var(--muted); }

  /* ── Bottom nav (sostituisce quella in cima su mobile) ── */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    display: flex;
    background: rgba(250,249,246,0.95);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 0.5px solid var(--border);
    height: calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nb {
    flex: 1; background: none; border: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; cursor: pointer;
    font-size: 10px; font-family: var(--font-body);
    color: var(--hint); transition: color 0.15s;
    padding: 8px 4px; min-height: 44px;
  }
  .nb .nb-icon { font-size: 20px; line-height: 1; }
  .nb .nb-label { font-size: 10px; }
  .nb.on { color: var(--text); }
  .nb.on .nb-icon { transform: scale(1.1); }

  /* ── Cards ── */
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r-lg); padding: 1.1rem; margin-bottom: 10px; }
  .tag { display: inline-block; padding: 2px 9px; background: var(--surface-2); color: var(--muted); border-radius: 10px; font-size: 11px; margin: 2px 2px 2px 0; }

  /* ── Concetto del giorno ── */
  .challenge-block { background: var(--surface-2); border-radius: var(--r-md); padding: 12px 14px; border-left: 2px solid var(--border-md); margin-top: 1rem; }
  .challenge-label { font-size: 10px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 7px; }
  .challenge-text { font-size: 14px; line-height: 1.7; }

  /* ── Type buttons ── */
  .type-btn {
    background: none; border: 0.5px solid var(--border-md);
    padding: 10px 14px; border-radius: var(--r-md);
    cursor: pointer; font-size: 14px; font-family: var(--font-body);
    color: var(--muted); transition: all 0.15s;
    min-height: 44px; flex: 1; text-align: center;
  }

  /* ── Textarea ── */
  textarea {
    width: 100%; min-height: 100px; padding: 12px;
    border: 0.5px solid var(--border-md); border-radius: var(--r-md);
    font-family: var(--font-body); font-size: 16px; /* 16px = no zoom iOS */
    resize: vertical; background: var(--bg); color: var(--text);
    line-height: 1.65; margin-top: 12px; outline: none; transition: border-color 0.15s;
  }
  textarea:focus { border-color: var(--accent); }

  /* ── Bottoni principali ── */
  .btn-main {
    background: var(--accent); color: var(--bg); border: none;
    padding: 12px 20px; border-radius: var(--r-md);
    cursor: pointer; font-size: 15px; font-weight: 500;
    font-family: var(--font-body); transition: opacity 0.15s;
    min-height: 44px;
  }
  .btn-main:hover { opacity: 0.82; }
  .btn-main:active { opacity: 0.7; }

  /* ── Flash ── */
  .flash { background: #EAF3DE; color: #27500A; padding: 11px 14px; border-radius: var(--r-md); margin-bottom: 1rem; font-size: 14px; font-weight: 500; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }

  /* ── Badge e metriche ── */
  .badge { padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: 500; }
  .metric { background: var(--surface-2); padding: 1rem; border-radius: var(--r-md); }
  .metric-label { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
  .metric-val { font-family: var(--font-display); font-size: 22px; font-weight: 400; }
  .metric-sub { font-size: 11px; color: var(--hint); margin-top: 5px; }

  /* ── Testo concetto ── */
  .concept-author { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .concept-title { font-family: var(--font-display); font-size: 22px; font-weight: 400; margin-bottom: 10px; }
  .concept-body { font-size: 14px; line-height: 1.75; }
  .section-label { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }

  /* ── Empty state ── */
  .empty { text-align: center; padding: 3.5rem 1rem; color: var(--muted); }
  .empty p:first-child { font-family: var(--font-display); font-size: 20px; color: var(--text); margin-bottom: 8px; }

  /* ── Libreria ── */
  .author-header { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin: 1.5rem 0 10px; }

  /* ── Diario ── */
  .log-meta { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-bottom: 9px; }
  .log-date { font-size: 12px; color: var(--hint); }
  .log-concept { font-size: 13px; font-weight: 500; }
  .log-source { font-size: 11px; color: var(--hint); font-style: italic; margin-top: 8px; }
  .log-text { font-size: 14px; line-height: 1.65; }

  /* ── Bar chart ── */
  .bar-row { margin-bottom: 12px; }
  .bar-info { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; }
  .bar-info span:last-child { color: var(--muted); font-size: 12px; }
  .bar-track { height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 3px; background: var(--accent); border-radius: 2px; }

  /* ── Misc ── */
  .reset-btn { background: none; border: none; cursor: pointer; font-size: 12px; color: var(--hint); text-decoration: underline; font-family: var(--font-body); min-height: 44px; }
  .count-badge { background: #EAF3DE; color: #27500A; padding: 1px 7px; border-radius: 8px; font-size: 11px; }
  .tag-filter { display:inline-block; padding:7px 12px; border-radius:20px; font-size:12px; cursor:pointer; border:0.5px solid var(--border-md); background:none; color:var(--muted); font-family:var(--font-body); transition:all 0.15s; margin:3px; min-height: 36px; }
  .tag-filter:hover { border-color:var(--accent); color:var(--text); }
  .tag-filter.on { background:var(--text); color:var(--bg); border-color:var(--text); }
  .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 12px; color: var(--muted); font-size: 14px; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sync-badge { font-size: 11px; color: var(--hint); text-align: right; margin-bottom: 6px; min-height: 14px; }

  /* ── Desktop: nav torna in cima ── */
  @media (min-width: 640px) {
    .wrap { padding: 2rem 1.5rem 4rem; }
    .nav {
      position: static;
      height: auto;
      padding-bottom: 0;
      background: none;
      backdrop-filter: none;
      border-top: none;
      border-bottom: 0.5px solid var(--border);
      margin-bottom: 1.25rem;
    }
    .nb {
      flex: none; flex-direction: row;
      border-bottom: 2px solid transparent;
      padding: 10px 14px; gap: 0;
      font-size: 13px; color: var(--muted);
    }
    .nb .nb-icon { display: none; }
    .nb .nb-label { font-size: 13px; }
    .nb.on { color: var(--text); border-bottom-color: var(--text); font-weight: 500; }
    .nb.on .nb-icon { transform: none; }
    .field input { font-size: 14px; }
    textarea { font-size: 14px; }
    .type-btn { flex: none; }
    .concept-title { font-size: 24px; }
  }
</style>
</head>

<div id="root"></div>
<script>
const SUPABASE_URL = 'https://hnwjosjjszchmmjwvarp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhud2pvc2pqc3pjaG1tand2YXJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NTAyNjUsImV4cCI6MjA5MzIyNjI2NX0.wh7Oe4829cp6XAPDqKjDk_siYY4WGTtVVH35Hckx-EA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const LEVELS = [
  {n:'Recluta',min:0,max:200},{n:'Soldato',min:200,max:500},
  {n:'Guerriero',min:500,max:1000},{n:'Campione',min:1000,max:2000},
  {n:'Gladiatore',min:2000,max:99999}
];
const XP = {Vittoria:50,Sconfitta:30,Insight:20};

let C=[], user=null;
let P={xp:0,streak:0,last_date:'',total:0};
let E=[], CR={}, N={};  // N: mappa concept_id → array di note
let todayConceptId=null;
let UI={view:'today',logType:'Insight',flash:null,authTab:'login',authError:'',authSuccess:'',syncing:false,editing:false,filterTag:null,logSearch:'',logFilter:'tutti',logSort:'date_desc',noteOpen:null};

// ─── Helpers ──────────────────────────────────────────────────────────────────
const lv = xp => LEVELS.find(l=>xp>=l.min&&xp<l.max)||LEVELS[4];
const isoToday = () => new Date().toISOString().split('T')[0];
const todayStr = () => new Date().toDateString();
const loggedToday = () => E.some(e=>new Date(e.created_at).toDateString()===todayStr() && e.concept_id===todayConceptId);
const typeColors = t => {
  if(t==='Vittoria') return {bg:'#EAF3DE',tx:'#27500A',br:'#C0DD97'};
  if(t==='Sconfitta') return {bg:'#FCEBEB',tx:'#791F1F',br:'#F7C1C1'};
  return {bg:'#E6F1FB',tx:'#0C447C',br:'#B5D4F4'};
};
const traduciErrore = msg => {
  if(msg.includes('Invalid login')) return 'Email o password errati.';
  if(msg.includes('Email not confirmed')) return 'Conferma prima la tua email.';
  if(msg.includes('already registered')) return 'Email già registrata. Prova ad accedere.';
  if(msg.includes('Password should')) return 'La password deve essere di almeno 6 caratteri.';
  return msg;
};

// ─── Supabase data ────────────────────────────────────────────────────────────
async function loadUserData(){
  try {
    const uid = user.id;
    const {data:prof} = await sb.from('profiles').select('*').eq('id',uid).single();
    if(prof) P = {xp:prof.xp||0, streak:prof.streak||0, last_date:prof.last_date||'', total:prof.total||0};
    const {data:entries} = await sb.from('entries').select('*').eq('user_id',uid).order('created_at',{ascending:false}).limit(200);
    if(entries) E = entries;
    const {data:reviews} = await sb.from('concept_reviews').select('*').eq('user_id',uid);
    CR = {};
    if(reviews) reviews.forEach(r => CR[r.concept_id] = r);
    const {data:notes} = await sb.from('concept_notes').select('*').eq('user_id',uid).order('created_at',{ascending:true});
    N = {};
    if(notes) notes.forEach(n => { if(!N[n.concept_id]) N[n.concept_id]=[]; N[n.concept_id].push(n); });
    todayConceptId = await getTodayConcept();
  } catch(err) {
    console.error('loadUserData error:', err);
  }
}
async function saveProfile(){
  await sb.from('profiles').upsert({id:user.id,xp:P.xp,streak:P.streak,last_date:P.last_date,total:P.total,updated_at:new Date().toISOString()});
}
async function saveEntry(entry){
  const {data} = await sb.from('entries').insert({user_id:user.id,concept_id:entry.cid,type:entry.type,text:entry.text,xp:entry.xp}).select().single();
  return data;
}
async function saveConceptNote(conceptId, text){
  const {data} = await sb.from('concept_notes').insert({user_id:user.id,concept_id:conceptId,text}).select().single();
  if(data){ if(!N[conceptId]) N[conceptId]=[]; N[conceptId].push(data); }
  return data;
}
async function deleteConceptNote(noteId, conceptId){
  await sb.from('concept_notes').delete().eq('id',noteId);
  if(N[conceptId]) N[conceptId] = N[conceptId].filter(n=>n.id!==noteId);
}

// ─── Spaced repetition ────────────────────────────────────────────────────────
async function getTodayConcept(){
  const today = isoToday();
  try {
    // Già assegnato oggi? Restituisci quello
    const {data:existing} = await sb.from('daily_log')
      .select('concept_id').eq('user_id',user.id).eq('date',today).maybeSingle();
    if(existing) return existing.concept_id;

    // Carica gli ultimi 30 giorni di daily_log per evitare ripetizioni recenti
    const {data:recentLog} = await sb.from('daily_log')
      .select('concept_id').eq('user_id',user.id)
      .order('date',{ascending:false}).limit(30);
    const recentIds = new Set((recentLog||[]).map(r => r.concept_id));

    const reviewedIds = new Set(Object.keys(CR).map(Number));

    // Priorità 1: concetti in scadenza (già visti, next_review <= oggi)
    const due = Object.values(CR)
      .filter(r => r.next_review <= today)
      .sort((a,b) => a.next_review.localeCompare(b.next_review));

    // Priorità 2: concetti mai visti E mai apparsi di recente nel daily_log
    const freshUnseen = C.filter(c => !reviewedIds.has(c.id) && !recentIds.has(c.id));

    // Priorità 3: concetti mai recensiti ma già apparsi nel daily_log (mostrati ma non completati)
    const shownUnseen = C.filter(c => !reviewedIds.has(c.id) && recentIds.has(c.id));

    // Priorità 4: tutti i concetti recensiti, dal più "vecchio" (minore next_review)
    const allReviewed = Object.values(CR)
      .sort((a,b) => a.next_review.localeCompare(b.next_review));

    let conceptId;
    if(due.length > 0){
      conceptId = due[0].concept_id;
    } else if(freshUnseen.length > 0){
      // Sceglie casualmente tra i primi 5 freschi per evitare sempre lo stesso ordine
      const pool = freshUnseen.slice(0, Math.min(freshUnseen.length, 5));
      conceptId = pool[Math.floor(Math.random() * pool.length)].id;
    } else if(shownUnseen.length > 0){
      conceptId = shownUnseen[0].id;
    } else if(allReviewed.length > 0){
      // Tutti visti: prende quello con next_review più vicino (anche se futuro)
      conceptId = allReviewed[0].concept_id;
    } else {
      conceptId = C[0].id;
    }

    await sb.from('daily_log').upsert({user_id:user.id, date:today, concept_id:conceptId});
    return conceptId;
  } catch(err) {
    console.error('getTodayConcept error:', err);
    return C[0]?.id ?? 0;
  }
}

async function updateConceptReview(conceptId, type){
  // Intervalli: Vittoria→raddoppia (max 60gg), Insight→+50% (max 30gg), Sconfitta→torna domani
  const prev = CR[conceptId];
  const prevInterval = prev ? prev.interval_days : 1;
  const prevCount = prev ? prev.review_count : 0;
  let newInterval;
  if(type==='Vittoria')      newInterval = Math.min(Math.round(prevInterval * 2.5), 60);
  else if(type==='Insight')  newInterval = Math.min(Math.round(prevInterval * 1.5), 30);
  else                       newInterval = 1; // Sconfitta → domani
  const nextDate = new Date();
  nextDate.setDate(nextDate.getDate() + newInterval);
  const nextReview = nextDate.toISOString().split('T')[0];
  const record = {user_id:user.id, concept_id:conceptId, next_review:nextReview, interval_days:newInterval, review_count:prevCount+1};
  await sb.from('concept_reviews').upsert(record);
  CR[conceptId] = record;
}

// ─── Concepts ─────────────────────────────────────────────────────────────────
async function loadConcepts(){
  try { const r=await fetch('./concepts.json'); if(!r.ok) throw new Error(); C=await r.json(); }
  catch(e){ C=[]; }
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render(){
  const root = document.getElementById('root');
  if(!user){ root.innerHTML=renderAuth(); return; }
  if(!C.length){ root.innerHTML=`<div class="wrap"><div class="loading-screen"><div class="spinner"></div><span>Caricamento concetti...</span></div></div>`; return; }

  const concept=C.find(c=>c.id===todayConceptId)||C[0], level=lv(P.xp);
  const pct=Math.min(100,Math.round(((P.xp-level.min)/(level.max-level.min))*100));
  // Concetti esplorati = con almeno una entry
  const exploredCount = new Set(E.map(e=>e.concept_id)).size;
  const totalConcepts = C.length;
  const exploredPct = totalConcepts ? Math.round((exploredCount/totalConcepts)*100) : 0;

  let h=`<div class="wrap">`;
  h+=`<div class="wordmark"><span>The Arena</span><button class="logout-btn" onclick="logout()">Esci (${user.email})</button></div>`;
  h+=`<div class="header">
    <div>
      <p class="level-name">${level.n}</p>
      <p class="xp-label">${P.xp} XP</p>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <p class="progress-hint">${level.max-P.xp<9999?level.max-P.xp+' XP al prossimo livello':'Livello massimo'}</p>
    </div>
    <div class="streak-block">
      <p class="streak-num">${P.streak}</p>
      <p class="streak-label">giorni streak</p>
      <p class="streak-label" style="margin-top:8px">${P.total} entr${P.total===1?'y':'ies'}</p>
    </div>
  </div>
  <div style="margin-bottom:1.25rem;padding-bottom:1.25rem;border-bottom:0.5px solid var(--border)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span style="font-size:11px;color:var(--muted)">Concetti esplorati</span>
      <span style="font-size:11px;color:var(--muted)">${exploredCount} di ${totalConcepts}</span>
    </div>
    <div style="height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden">
      <div style="width:${exploredPct}%;height:4px;background:var(--accent);border-radius:2px;transition:width 0.4s ease"></div>
    </div>
  </div>`;

  const views=[['today','⚔️','Sfida'],['library','📚','Libreria'],['log','📖','Diario'],['stats','📊','Stats']];
  h+=`<nav class="nav">`;
  views.forEach(([k,icon,l])=>h+=`<button class="nb${UI.view===k?' on':''}" onclick="sv('${k}')"><span class="nb-icon">${icon}</span><span class="nb-label">${l}</span></button>`);
  h+=`</nav>`;
  h+=`<div class="sync-badge">${UI.syncing?'⟳ Salvataggio in corso...':''}</div>`;
  if(UI.flash) h+=`<div class="flash" id="flash-msg">${UI.flash}</div>`;

  if(UI.view==='today') h+=viewToday(concept);
  else if(UI.view==='library') h+=viewLibrary();
  else if(UI.view==='log') h+=viewLog();
  else h+=viewStats();
  h+=`</div>`;
  root.innerHTML=h;
}

function viewLog(){
  const typeColors2 = {
    'Vittoria': {bg:'#EAF3DE',tx:'#27500A',br:'#C0DD97'},
    'Sconfitta': {bg:'#FCEBEB',tx:'#791F1F',br:'#F7C1C1'},
    'Insight':   {bg:'#E6F1FB',tx:'#0C447C',br:'#B5D4F4'},
  };

  // Conteggi per tipo
  const counts = {tutti:E.length, Vittoria:0, Sconfitta:0, Insight:0};
  E.forEach(e=>{ if(counts[e.type]!==undefined) counts[e.type]++; });

  // Filtro per tipo
  const byType = UI.logFilter==='tutti' ? E : E.filter(e=>e.type===UI.logFilter);

  // Filtro per testo
  const q = UI.logSearch.toLowerCase();
  const filtered = q ? byType.filter(e=>{
    const c=C.find(x=>x.id===e.concept_id);
    return e.text.toLowerCase().includes(q)
      ||(c&&c.t.toLowerCase().includes(q))
      ||(c&&c.a.toLowerCase().includes(q))
      ||e.type.toLowerCase().includes(q);
  }) : byType;

  // Pills filtro tipo
  let h=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">`;
  [['tutti','Tutte',null],['Vittoria','Vittorie',typeColors2.Vittoria],['Sconfitta','Sconfitte',typeColors2.Sconfitta],['Insight','Insights',typeColors2.Insight]].forEach(([key,label,col])=>{
    const isOn = UI.logFilter===key;
    const bg = isOn && col ? col.bg : isOn ? 'var(--text)' : 'none';
    const tx = isOn && col ? col.tx : isOn ? 'var(--bg)' : 'var(--muted)';
    const br = isOn && col ? col.br : isOn ? 'var(--text)' : 'var(--border-md)';
    h+=`<button onclick="setLogFilter('${key}')" style="background:${bg};color:${tx};border:0.5px solid ${br};padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-family:var(--font-body);min-height:34px;transition:all 0.15s">${label} <span style="opacity:0.7">${counts[key]}</span></button>`;
  });
  h+=`</div>`;

  // Barra di ricerca
  h+=`<div style="margin-bottom:1rem;position:relative">
    <input id="log-search" type="search" placeholder="Cerca per concetto, autore, testo..."
      value="${UI.logSearch.replace(/"/g,'&quot;')}"
      oninput="updateLogSearch(this.value)"
      style="width:100%;padding:10px 12px 10px 36px;border:0.5px solid var(--border-md);border-radius:var(--r-md);font-family:var(--font-body);font-size:16px;background:var(--bg);color:var(--text);outline:none;">
    <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--hint);pointer-events:none">⌕</span>
    ${UI.logSearch?`<button onclick="updateLogSearch('')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--hint);font-size:18px;line-height:1">×</button>`:''}
  </div>`;

  if(!E.length) return h+`<div class="empty"><p>Il diario è vuoto</p><p>Completa la sfida del giorno per iniziare.</p></div>`;
  if(!filtered.length) return h+`<div class="empty"><p>Nessun risultato</p><p style="font-size:13px">${q?`Nessuna entry corrisponde a "<em>${UI.logSearch}</em>".`:'Nessuna entry per questo filtro.'}</p></div>`;

  // Ordinamento
  const sortOptions=[['date_desc','Recenti'],['date_asc','Meno recenti'],['concept','Concetto A→Z'],['xp','XP ↓']];
  const sorted=[...filtered].sort((a,b)=>{
    if(UI.logSort==='date_asc') return new Date(a.created_at)-new Date(b.created_at);
    if(UI.logSort==='concept'){
      const ca=C.find(x=>x.id===a.concept_id)?.t||'';
      const cb=C.find(x=>x.id===b.concept_id)?.t||'';
      return ca.localeCompare(cb,'it');
    }
    if(UI.logSort==='xp') return b.xp-a.xp;
    return new Date(b.created_at)-new Date(a.created_at);
  });

  h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:8px">
    <p style="font-size:13px;color:var(--muted)">${filtered.length}${filtered.length!==E.length?' di '+E.length:''} entr${filtered.length===1?'y':'ies'}</p>
    <div style="display:flex;align-items:center;gap:6px">
      <span style="font-size:11px;color:var(--hint)">Ordina:</span>
      <select onchange="setLogSort(this.value)" style="font-size:12px;font-family:var(--font-body);color:var(--text);background:var(--bg);border:0.5px solid var(--border-md);border-radius:var(--r-md);padding:5px 8px;cursor:pointer;outline:none">
        ${sortOptions.map(([val,label])=>`<option value="${val}"${UI.logSort===val?' selected':''}>${label}</option>`).join('')}
      </select>
    </div>
  </div>`;

  const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const hi=txt=>q?txt.replace(new RegExp(`(${esc(q)})`,'gi'),'<mark style="background:#FFF3CD;border-radius:2px;padding:0 1px">$1</mark>'):txt;

  sorted.forEach(e=>{
    const c=C.find(x=>x.id===e.concept_id), col=typeColors(e.type);
    const d=new Date(e.created_at).toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'});
    h+=`<div class="card">
      <div class="log-meta">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="badge" style="background:${col.bg};color:${col.tx}">${e.type}</span>
          ${c?`<span class="log-concept">${hi(c.t)}</span>`:''}
        </div>
        <span class="log-date">${d} &nbsp;+${e.xp} XP</span>
      </div>
      <p class="log-text">${hi(e.text)}</p>
      ${c?`<p class="log-source">${c.a} — ${c.b}</p>`:''}
    </div>`;
  });
  return h;
}

// ─── Stats helpers ────────────────────────────────────────────────────────────
function calcLongestStreak(){
  if(!E.length) return 0;
  const days=[...new Set(E.map(e=>new Date(e.created_at).toDateString()))].map(d=>new Date(d)).sort((a,b)=>a-b);
  let max=1,cur=1;
  for(let i=1;i<days.length;i++){
    const diff=(days[i]-days[i-1])/(1000*60*60*24);
    if(Math.round(diff)===1){cur++;max=Math.max(max,cur);}else cur=1;
  }
  return max;
}

function buildHeatmap(){
  // Mappa data ISO → tipo entry
  const entryMap={};
  E.forEach(e=>{
    const key=new Date(e.created_at).toISOString().split('T')[0];
    if(!entryMap[key]) entryMap[key]=e.type;
  });

  const today=new Date(); today.setHours(0,0,0,0);
  const todayKey=isoToday();

  // Inizia dal lunedì di 25 settimane fa
  const start=new Date(today);
  start.setDate(start.getDate()-181);
  const dow=start.getDay();
  start.setDate(start.getDate()+(dow===0?-6:1-dow));

  // Costruisci settimane
  const weeks=[];
  const cur=new Date(start);
  while(cur<=today){
    const week=[];
    for(let d=0;d<7;d++){
      const key=cur.toISOString().split('T')[0];
      week.push({key,type:entryMap[key]||null,future:cur>today,isToday:key===todayKey,date:new Date(cur)});
      cur.setDate(cur.getDate()+1);
    }
    weeks.push(week);
  }

  // Etichette mesi
  const monthLabels=[];
  weeks.forEach((week,wi)=>{
    const first=week[0];
    if(wi===0||(first.date.getDate()<=7&&first.date.getDate()>1)){
      monthLabels.push({wi,label:first.date.toLocaleDateString('it-IT',{month:'short'})});
    }
  });

  const typeBg=t=>{
    if(t==='Vittoria') return '#C0DD97';
    if(t==='Sconfitta') return '#F7C1C1';
    if(t==='Insight') return '#B5D4F4';
    return 'var(--surface-2)';
  };

  const daysLogged=Object.keys(entryMap).filter(k=>k>=weeks[0]?.key).length;
  const totalDays=weeks.flat().filter(d=>!d.future).length;
  const consistency=totalDays?Math.round((daysLogged/totalDays)*100):0;

  let h=`<div class="card" style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px">
      <p class="section-label" style="margin:0">Attività — ultimi 6 mesi</p>
      <span style="font-size:12px;color:var(--muted)">${consistency}% di costanza</span>
    </div>`;

  // Griglia
  h+=`<div style="overflow-x:auto;padding-bottom:4px">`;
  // Month labels
  h+=`<div style="display:flex;margin-left:20px;margin-bottom:4px;position:relative;height:14px">`;
  monthLabels.forEach(({wi,label})=>{
    h+=`<div style="position:absolute;left:${wi*15}px;font-size:10px;color:var(--hint)">${label}</div>`;
  });
  h+=`</div>`;
  // Grid container
  h+=`<div style="display:flex;gap:3px">`;
  // Day labels
  h+=`<div style="display:flex;flex-direction:column;gap:3px;margin-right:2px">`;
  ['L','','M','','V','','D'].forEach(d=>{
    h+=`<div style="width:14px;height:12px;font-size:9px;color:var(--hint);line-height:12px;text-align:right;flex-shrink:0">${d}</div>`;
  });
  h+=`</div>`;
  // Weeks
  weeks.forEach(week=>{
    h+=`<div style="display:flex;flex-direction:column;gap:3px">`;
    week.forEach(day=>{
      const bg=day.future?'transparent':typeBg(day.type);
      const ring=day.isToday?`outline:2px solid var(--accent);outline-offset:1px;`:'';
      const tip=day.type?`${day.key}: ${day.type}`:day.key;
      h+=`<div title="${tip}" style="width:12px;height:12px;border-radius:2px;background:${bg};${ring}flex-shrink:0"></div>`;
    });
    h+=`</div>`;
  });
  h+=`</div></div>`;

  // Legenda
  h+=`<div style="display:flex;gap:14px;margin-top:12px;flex-wrap:wrap">`;
  [['Vittoria','#C0DD97'],['Insight','#B5D4F4'],['Sconfitta','#F7C1C1'],['Nessuna','var(--surface-2)']].forEach(([label,color])=>{
    h+=`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)">
      <div style="width:10px;height:10px;border-radius:2px;background:${color};border:0.5px solid rgba(0,0,0,0.08)"></div>${label}
    </div>`;
  });
  h+=`</div></div>`;
  return h;
}

function viewStats(){
  const level=lv(P.xp), pct=Math.min(100,Math.round(((P.xp-level.min)/(level.max-level.min))*100));
  const v=E.filter(e=>e.type==='Vittoria').length;
  const sc=E.filter(e=>e.type==='Sconfitta').length;
  const ins=E.filter(e=>e.type==='Insight').length;

  // ── Record storici ──
  const longestStreak=calcLongestStreak();

  // XP questa settimana vs settimana scorsa
  const now=new Date(); now.setHours(0,0,0,0);
  const startOfWeek=new Date(now); startOfWeek.setDate(now.getDate()-(now.getDay()||7)+1);
  const startOfLastWeek=new Date(startOfWeek); startOfLastWeek.setDate(startOfWeek.getDate()-7);
  const xpThisWeek=E.filter(e=>{const d=new Date(e.created_at);return d>=startOfWeek&&d<=now;}).reduce((s,e)=>s+e.xp,0);
  const xpLastWeek=E.filter(e=>{const d=new Date(e.created_at);return d>=startOfLastWeek&&d<startOfWeek;}).reduce((s,e)=>s+e.xp,0);
  const xpDelta=xpThisWeek-xpLastWeek;
  const xpArrow=xpDelta>0?`<span style="color:#27500A">↑ +${xpDelta}</span>`:xpDelta<0?`<span style="color:#791F1F">↓ ${xpDelta}</span>`:`<span style="color:var(--hint)">= 0</span>`;

  // Concetto più praticato
  const conceptCount={};
  E.forEach(e=>{conceptCount[e.concept_id]=(conceptCount[e.concept_id]||0)+1;});
  const topConceptEntry=Object.entries(conceptCount).sort((a,b)=>b[1]-a[1])[0];
  const topConcept=topConceptEntry?C.find(c=>c.id===Number(topConceptEntry[0])):null;

  // Temi
  const tagC={};
  E.forEach(e=>{const c=C.find(x=>x.id===e.concept_id);if(c)c.tags.forEach(t=>{tagC[t]=(tagC[t]||0)+1;});});
  const topT=Object.entries(tagC).sort((a,b)=>b[1]-a[1]).slice(0,6);

  let h='';

  // Heatmap
  if(E.length) h+=buildHeatmap();

  // Metriche principali
  h+=`<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:1.25rem">
    <div class="metric"><p class="metric-label">Livello</p><p class="metric-val">${level.n}</p><div class="progress-bar" style="width:100%;margin-top:8px"><div class="progress-fill" style="width:${pct}%"></div></div></div>
    <div class="metric"><p class="metric-label">XP totale</p><p class="metric-val">${P.xp}</p><p class="metric-sub">${level.max-P.xp<9999?level.max-P.xp+' al prossimo':'Max!'}</p></div>
    <div class="metric"><p class="metric-label">Streak attuale</p><p class="metric-val">${P.streak}gg</p><p class="metric-sub">Record: ${longestStreak}gg</p></div>
  </div>`;

  // Record storici
  h+=`<div class="card" style="margin-bottom:12px">
    <p class="section-label">Record personali</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div style="background:var(--surface-2);padding:12px;border-radius:var(--r-md)">
        <p style="font-size:11px;color:var(--muted);margin-bottom:4px">XP questa settimana</p>
        <p style="font-family:'EB Garamond',serif;font-size:22px">${xpThisWeek}</p>
        <p style="font-size:11px;margin-top:4px">${xpArrow} vs settimana scorsa</p>
      </div>
      <div style="background:var(--surface-2);padding:12px;border-radius:var(--r-md)">
        <p style="font-size:11px;color:var(--muted);margin-bottom:4px">Streak più lungo</p>
        <p style="font-family:'EB Garamond',serif;font-size:22px">${longestStreak}gg</p>
        <p style="font-size:11px;color:var(--hint);margin-top:4px">${longestStreak===P.streak&&P.streak>0?'Record attivo 🔥':'Attuale: '+P.streak+'gg'}</p>
      </div>
      ${topConcept?`<div style="background:var(--surface-2);padding:12px;border-radius:var(--r-md);grid-column:span 2">
        <p style="font-size:11px;color:var(--muted);margin-bottom:4px">Concetto più praticato</p>
        <p style="font-size:14px;font-weight:500">${topConcept.t}</p>
        <p style="font-size:11px;color:var(--hint);margin-top:3px">${topConcept.a} — ${topConceptEntry[1]} entr${topConceptEntry[1]===1?'y':'ies'}</p>
      </div>`:''}
    </div>
  </div>`;

  // Battle log
  h+=`<div class="card" style="margin-bottom:12px"><p class="section-label">Battle log</p>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
      <div style="background:#EAF3DE;padding:12px;border-radius:8px;text-align:center"><p style="font-family:'EB Garamond',serif;font-size:26px;color:#27500A">${v}</p><p style="font-size:12px;color:#3B6D11;margin-top:2px">Vittorie</p></div>
      <div style="background:#FCEBEB;padding:12px;border-radius:8px;text-align:center"><p style="font-family:'EB Garamond',serif;font-size:26px;color:#791F1F">${sc}</p><p style="font-size:12px;color:#A32D2D;margin-top:2px">Sconfitte</p></div>
      <div style="background:#E6F1FB;padding:12px;border-radius:8px;text-align:center"><p style="font-family:'EB Garamond',serif;font-size:26px;color:#0C447C">${ins}</p><p style="font-size:12px;color:#185FA5;margin-top:2px">Insights</p></div>
    </div>
  </div>`;

  // Temi
  if(topT.length){
    h+=`<div class="card" style="margin-bottom:12px"><p class="section-label">Temi più praticati</p>`;
    topT.forEach(([tag,cnt])=>{
      const w=Math.round((cnt/topT[0][1])*100);
      h+=`<div class="bar-row"><div class="bar-info"><span>${tag}</span><span>${cnt}</span></div><div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div></div>`;
    });
    h+=`</div>`;
  }

  h+=`<div style="text-align:center;margin-top:1.5rem"><button class="reset-btn" onclick="resetAll()">Reset tutti i dati</button></div>`;
  h+=`<div class="card" style="margin-top:1.25rem">
    <p class="section-label">Esporta i tuoi dati</p>
    <p style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6">Scarica una copia locale del tuo diario come backup o per analizzarlo altrove.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn-main" style="width:auto;font-size:13px" onclick="exportJSON()">↓ Esporta JSON</button>
      <button class="btn-main" style="width:auto;font-size:13px;background:var(--surface-2);color:var(--text)" onclick="exportCSV()">↓ Esporta CSV</button>
    </div>
  </div>`;
  return h;
}

// ─── Azioni ───────────────────────────────────────────────────────────────────
window.sv=v=>{UI.view=v;UI.flash=null;render();};
window.setAuthTab=t=>{UI.authTab=t;UI.authError='';UI.authSuccess='';render();};
window.stype=t=>{
  UI.logType=t;
  document.querySelectorAll('[data-tp]').forEach(btn=>{
    const tp=btn.getAttribute('data-tp'),col=typeColors(tp),isOn=tp===t;
    btn.style.background=isOn?col.bg:''; btn.style.color=isOn?col.tx:'';
    btn.style.borderColor=isOn?col.br:''; btn.style.fontWeight=isOn?'500':'';
  });
};

window.authSubmit=async()=>{
  const email=document.getElementById('auth-email')?.value?.trim();
  const pw=document.getElementById('auth-pw')?.value;
  if(!email||!pw){UI.authError='Inserisci email e password.';render();return;}
  UI.authError='';UI.authSuccess='';
  if(UI.authTab==='login'){
    const {error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error){UI.authError=traduciErrore(error.message);render();}
  } else {
    const {error}=await sb.auth.signUp({email,password:pw});
    if(error){UI.authError=traduciErrore(error.message);render();}
    else{UI.authSuccess='Account creato! Controlla la tua email per confermare, poi accedi.';UI.authTab='login';render();}
  }
};

window.resetPassword=async()=>{
  const email=document.getElementById('auth-email')?.value?.trim();
  if(!email){UI.authError='Inserisci la tua email prima.';render();return;}
  await sb.auth.resetPasswordForEmail(email);
  UI.authSuccess='Email di reset inviata. Controlla la tua casella.';UI.authError='';render();
};

window.logout=async()=>{
  await sb.auth.signOut();
  user=null;P={xp:0,streak:0,last_date:'',total:0};E=[];UI.view='today';render();
};

window.submitEntry=async()=>{
  const ta=document.getElementById('log-txt');
  const text=ta?.value?.trim();
  if(!text){if(ta){ta.style.borderColor='#E24B4A';setTimeout(()=>ta.style.borderColor='',1500);}return;}
  const today=todayStr(), yest=new Date();
  yest.setDate(yest.getDate()-1);
  if(P.last_date===yest.toDateString()) P.streak+=1;
  else if(P.last_date!==today) P.streak=1;
  P.last_date=today;
  const xpGain=XP[UI.logType];
  P.xp+=xpGain; P.total+=1;
  UI.syncing=true; render();
  const [saved]=await Promise.all([
    saveEntry({cid:todayConceptId,type:UI.logType,text,xp:xpGain}),
    saveProfile(),
    updateConceptReview(todayConceptId, UI.logType)
  ]);
  if(saved) E.unshift(saved);
  UI.syncing=false;
  UI.flash=`+${xpGain} XP — ${UI.logType} registrata! Streak: ${P.streak} giorni.`;
  render();
  setTimeout(()=>{UI.flash=null;const f=document.getElementById('flash-msg');if(f)f.remove();},3500);
};

window.updateLogSearch=val=>{
  UI.logSearch=val;
  // Aggiorna solo il contenuto senza re-render completo per mantenere il focus
  const app=document.getElementById('app');
  if(app && UI.view==='log'){ render(); document.getElementById('log-search')?.focus(); }
};

window.openNote=conceptId=>{ UI.noteOpen=conceptId; render(); setTimeout(()=>document.getElementById('note-txt')?.focus(),50); };
window.closeNote=()=>{ UI.noteOpen=null; render(); };

window.submitNote=async(conceptId)=>{
  const ta=document.getElementById('note-txt');
  const text=ta?.value?.trim();
  if(!text){ if(ta){ta.style.borderColor='#E24B4A'; setTimeout(()=>ta.style.borderColor='',1500);} return; }
  UI.syncing=true; render();
  await saveConceptNote(conceptId, text);
  UI.syncing=false; UI.noteOpen=null;
  UI.flash='Nota salvata.';
  render();
  setTimeout(()=>{UI.flash=null; const f=document.getElementById('flash-msg'); if(f)f.remove();},2500);
};

window.deleteNote=async(noteId,conceptId)=>{
  if(!confirm('Eliminare questa nota?')) return;
  await deleteConceptNote(noteId, conceptId);
  render();
};

window.setLogSort=s=>{UI.logSort=s; render();};
window.setLogFilter=f=>{UI.logFilter=f; render();};
window.setTagFilter=tag=>{UI.filterTag=tag; render();};

window.exportJSON=()=>{
  const data={
    exported_at: new Date().toISOString(),
    profile: P,
    entries: E.map(e=>{
      const c=C.find(x=>x.id===e.concept_id);
      return {...e, concept_title:c?.t||'', concept_author:c?.a||'', concept_book:c?.b||''};
    }),
    concept_reviews: Object.values(CR)
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`the-arena-${isoToday()}.json`; a.click();
  URL.revokeObjectURL(url);
};

window.exportCSV=()=>{
  const rows=[['Data','Concetto','Autore','Libro','Tipo','XP','Riflessione']];
  [...E].sort((a,b)=>a.created_at.localeCompare(b.created_at)).forEach(e=>{
    const c=C.find(x=>x.id===e.concept_id);
    const d=new Date(e.created_at).toLocaleDateString('it-IT');
    rows.push([d, c?.t||'', c?.a||'', c?.b||'', e.type, e.xp, `"${e.text.replace(/"/g,'""')}"`]);
  });
  const csv=rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`the-arena-${isoToday()}.csv`; a.click();
  URL.revokeObjectURL(url);
};

window.trainOnConcept=async(conceptId)=>{
  if(loggedToday()) return;
  const today=isoToday();
  await sb.from('daily_log').upsert({user_id:user.id, date:today, concept_id:conceptId});
  todayConceptId=conceptId;
  UI.view='today'; UI.flash=null;
  render();
};

window.resetAll=async()=>{
  if(!confirm('Sei sicuro? Tutti i dati verranno eliminati permanentemente.')) return;
  await Promise.all([
    sb.from('entries').delete().eq('user_id',user.id),
    sb.from('daily_log').delete().eq('user_id',user.id),
    sb.from('concept_reviews').delete().eq('user_id',user.id),
  ]);
  P={xp:0,streak:0,last_date:'',total:0}; E=[]; CR={}; todayConceptId=null;
  await saveProfile();
  todayConceptId=await getTodayConcept();
  render();
};

window.startEdit=()=>{
  const entry=E.find(e=>new Date(e.created_at).toDateString()===todayStr());
  UI.editing=true; UI.editType=entry?.type||'Insight'; render();
};
window.cancelEdit=()=>{ UI.editing=false; UI.editType=null; render(); };
window.setEditType=t=>{
  UI.editType=t;
  document.querySelectorAll('[data-tp]').forEach(btn=>{
    const tp=btn.getAttribute('data-tp'),col=typeColors(tp),isOn=tp===t;
    btn.style.background=isOn?col.bg:''; btn.style.color=isOn?col.tx:'';
    btn.style.borderColor=isOn?col.br:''; btn.style.fontWeight=isOn?'500':'';
  });
};
window.saveEdit=async()=>{
  const ta=document.getElementById('edit-txt');
  const text=ta?.value?.trim();
  if(!text){if(ta){ta.style.borderColor='#E24B4A';setTimeout(()=>ta.style.borderColor='',1500);}return;}
  const entry=E.find(e=>new Date(e.created_at).toDateString()===todayStr());
  if(!entry) return;
  const newType=UI.editType||entry.type;
  // aggiusta XP: rimuovi vecchio, aggiungi nuovo
  const xpDiff=XP[newType]-entry.xp;
  UI.syncing=true; render();
  await sb.from('entries').update({type:newType,text}).eq('id',entry.id);
  // aggiorna stato locale
  entry.type=newType; entry.text=text; entry.xp=XP[newType];
  P.xp+=xpDiff;
  await saveProfile();
  UI.syncing=false; UI.editing=false; UI.editType=null;
  UI.flash='Entry aggiornata.';
  render();
  setTimeout(()=>{UI.flash=null;const f=document.getElementById('flash-msg');if(f)f.remove();},3000);
};


// ─── Boot ─────────────────────────────────────────────────────────────────────
let _booting = false;

async function boot(){
  if(_booting) return;
  _booting = true;

  document.getElementById('root').innerHTML = `<div class="wrap"><div class="loading-screen"><div class="spinner"></div><span>Caricamento...</span></div></div>`;

  try {
    // 1. Carica concetti (non dipende dall'auth)
    await loadConcepts();

    // 2. Leggi la sessione corrente una volta sola
    const { data:{ session } } = await sb.auth.getSession();
    user = session?.user ?? null;
    if(user) await loadUserData();
    render();

    // 3. Ascolta i cambi di sessione DOPO il boot iniziale
    //    così non si innesca una seconda loadUserData() in parallelo
    sb.auth.onAuthStateChange(async(event, session) => {
      if(event === 'SIGNED_IN'){
        const incoming = session?.user ?? null;
        // Evita il reload se è lo stesso utente già caricato
        if(incoming && incoming.id !== user?.id){
          user = incoming;
          await loadUserData();
          render();
        }
      } else if(event === 'SIGNED_OUT'){
        user = null;
        P = {xp:0,streak:0,last_date:'',total:0};
        E = []; CR = {}; todayConceptId = null;
        UI.view = 'today';
        render();
      }
      // TOKEN_REFRESHED e altri eventi: ignora, i dati sono già caricati
    });

  } catch(err) {
    console.error('Errore boot:', err);
    document.getElementById('root').innerHTML = `
      <div class="wrap" style="text-align:center;padding-top:4rem">
        <p style="font-family:'EB Garamond',serif;font-size:20px;margin-bottom:8px">Qualcosa è andato storto</p>
        <p style="font-size:13px;color:#6B6A65;margin-bottom:1.5rem">Controlla la connessione e riprova.</p>
        <button class="btn-main" style="width:auto" onclick="location.reload()">Ricarica la pagina</button>
      </div>`;
  }

  _booting = false;
}

boot();
</script>
